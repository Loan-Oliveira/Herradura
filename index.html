            line-height: 1;
            min-width: 44px;
            min-height: 44px;

                right: 0;

                background: #4A2E1B;
                border-bottom: 3px solid #2a170b

            .nav.open nav {
                display: flex

                margin: 0;
                padding: 14px 20px;
                font-size: 1rem;
                border-top: 1px solid rgba(243, 226, 195, .15)

            inset: 0;

            color: #F3E2C3

            margin: 0 auto 6px

            font-size: clamp(2.6rem, 10vw, 4.8rem);
            letter-spacing: .04em;
            margin: 0;
            color: var(--hd)

            letter-spacing: .55em;
            padding-left: .55em;

            color: var(--hd)

        .tg {
            font-weight: 600;
            margin: 14px 0 0

        .kicker {
            margin: 0 0 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-size: .78rem;
            color: var(--acc);
            font-weight: 600

            border: 1px solid var(--hd);
            border-radius: 99px;
            font-size: .85rem;
            margin: 0

            margin: 0 0 4px;

            font-size: .9rem;
            opacity: .85

            color: var(--acc)

            cursor: pointer

            min-height: 40px;
            border-color: #4A2E1B

            margin: auto;
            text-align: center;
            white-space: pre-line

            margin: 0
        }

            padding: 14px;
            border-radius: 6px;
            margin-top: 22px;
            font-weight: 600

        }

            justify-content: space-between;
            border-bottom: 1px dashed var(--ln);
            padding: 3px 0
        }

        footer {
            background: #3b2314;
            color: #F3E2C3;
            padding: 44px 20px 96px;
            text-align: center
        }

        .ft {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 28px
        }

            font-family: Cinzel, Georgia, serif;
            letter-spacing: .08em;
            margin: 0 0 10px;
            color: #E7C79B
        }

        .ft p {
            margin: 4px 0;
            overflow-wrap: anywhere
        }

        footer a {
            color: #E7C79B
        }

        .soc {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap
        }

        .soc a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid #E7C79B;
            border-radius: 99px;
            text-decoration: none
        }

        .cp {
            margin: 28px 0 0;
            font-size: .8rem;
            opacity: .7
        }

        .wa {
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            background: #25D366;
            color: #fff;
            padding: 12px 18px;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            z-index: 6;
            box-shadow: 0 3px 10px #0006
        }

        #admin {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99;
            background: var(--bg);
            overflow: auto;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 40px
        }

        #admin.on {
            display: block
        }

        .ah {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .ah span {
            flex: 1;
            font-size: .85rem
        }

        .ab {
            max-width: 720px;
            margin: auto
        }

        .ab label {
            display: block;
            margin: 8px 0;
            font-size: .85rem
        }

        .r {
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: 10px;
            margin: 12px 0;
            background: var(--card)
        }

        .r.h {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .r.h input {
            width: auto
        }

        .ip img {
            width: 120px;
            border-radius: 4px;
            display: block;
            margin-bottom: 6px
        }

        .ck input {
            width: auto
        }
    </style>
</head>

<section class="hero"><div class="hero-media">${c.logo ? `<img class="logo" src="${esc(c.logo)}" alt="Logo ${esc(c.name)}">` : ''}</div><div class="hero-txt"><h1>${esc(n1)}</h1><p class="rest">${esc(n2.join(' '))}</p><p class="kicker">📍 Caminho do Vinho${c.city ? ' · ' + esc(c.city) : ''}</p><p class="open">${isOpen() ? '🟢 Aberto agora' : '🔴 Fechado agora'}</p><p class="tg">${esc(c.tagline)}</p><div class="btns"><a class="btn" href="${wa('Olá! Gostaria de fazer um pedido.')}">Pedir agora</a><a class="btn alt" href="#reserva">Reservar mesa</a></div></div></section>
<section id="caminho"><h2>${esc(c.cv_title)}</h2><p class="tags"><span>📍 Caminho do Vinho</span><span>🍽 Passeio gastronômico</span><span>👥 Grupos e excursões</span></p><p class="story">${esc(c.cv_text)}</p><div class="btns"><a class="btn" href="${wa('Olá! Gostaria de reservar para um grupo durante o passeio pelo Caminho do Vinho.')}">Reservar para grupo</a><a class="btn alt" style="color:var(--ink)" href="#onde">Como chegar</a></div></section><section><h2>Pratos da Casa</h2><p class="sub">Os queridinhos de quem visita a Herradura</p><div class="grid">${hl.map(card).join('')}</div></section>
<section class="alt" id="cardapio"><h2>Cardápio</h2><p class="sub">Parrilla, churrasco e comida caseira</p><div id="mb">${menuH()}</div><div class="btns"><a class="btn" href="${wa('Olá! Gostaria de fazer um pedido.')}">Pedir pelo WhatsApp</a>${c.ifood ? `<a class="btn alt" style="color:var(--ink)" href="${esc(safe(c.ifood))}">Pedir pelo delivery</a>` : ''}</div></section>
<section id="historia"><h2>Nossa História</h2><p class="story">${esc(c.story)}</p></section>
<section class="alt" id="galeria"><h2>Galeria</h2><p class="sub">Um pouco do nosso cantinho</p><div class="grid">${D.gallery.map(g => `<figure class="card">${pic(g.img)}<figcaption class="cap">${esc(g.desc)}</figcaption></figure>`).join('')}</div></section>
<section><h2>Eventos & Promoções</h2><p class="sub">&nbsp;</p><div class="grid">${D.events.map(e => `<div class="card cb"><h3>${esc(e.title)}</h3><p>${esc(e.desc)}</p></div>`).join('')}</div>${c.promo ? `<div class="promo">🎟 ${esc(c.promo)}</div>` : ''}</section>
<section class="alt"><h2>Quem Já Veio</h2><p class="sub">&nbsp;</p><div class="grid">${D.reviews.map(r => `<div class="card cb rv">“${esc(r.text)}”<b>${esc(r.name)}</b></div>`).join('')}</div></section>
<section id="reserva"><h2>Reserve sua Mesa</h2><p class="sub">Preencha e confirme pelo WhatsApp</p><form id="rf"><input name="n" placeholder="Seu nome" required><input name="d" type="date" required><input name="h" type="time" required><input name="p" type="number" min="1" placeholder="Nº de pessoas" required><button>Reservar pelo WhatsApp</button></form></section>
<section class="alt" id="onde"><h2>Onde Nos Achar</h2><p class="sub">No Caminho do Vinho · ${esc(c.address)}${c.city ? ' – ' + esc(c.city) : ''}</p><div class="map"><div><iframe loading="lazy" title="Mapa" src="${esc(mapSrc)}"></iframe><div class="btns"><a class="btn" href="${esc(mapLink)}">Como chegar</a></div></div><div class="hrs"><h3>Horários</h3>${[1, 2, 3, 4, 5, 6, 0].map(i => { const h = c.hours[i]; return `<div><span>${DN[i]}</span><span>${h.o && h.c ? h.o + ' – ' + h.c : 'Fechado'}</span></div>` }).join('')}</div></div></section>
<footer id="contato"><div class="ft"><div>${c.logo ? `<img class="lgl" src="${esc(c.logo)}" alt="" style="height:64px;display:block;margin:0 auto 8px">` : ''}<b style="font-family:Cinzel,serif;letter-spacing:.1em">${esc(c.name)}</b><p>📍 ${esc(c.address)}${c.city ? ' – ' + esc(c.city) : ''}</p></div><div><h4>Contato</h4><p><a href="${wa('Olá! Gostaria de mais informações.')}">WhatsApp ${esc(fmt(c.phone))}</a></p>${c.email ? `<p><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p>` : ''}<p><a href="${esc(mapLink)}">Como chegar</a></p></div><div><h4>Redes sociais</h4><div class="soc">${c.insta ? `<a href="https://instagram.com/${esc(c.insta.replace(/^@/, ''))}">Instagram</a>` : ''}${c.facebook ? `<a href="${esc(safe(c.facebook))}">Facebook</a>` : ''}<a href="${wa('Olá! Vim pelo site.')}">WhatsApp</a></div></div></div><p class="cp">© ${new Date().getFullYear()} ${esc(c.name)}. Todos os direitos reservados.</p></footer>`;
            navUp(); $('#rf').onsubmit = e => { e.preventDefault(); const f = e.target; location.href = wa(`Olá! Gostaria de reservar uma mesa. Em nome de: ${f.n.value}, para a data: ${f.d.value}, no horário: ${f.h.value}, para: ${f.p.value} pessoas.`) }
        }
        function navUp() { const n = $('.nav'); if (!n) return; const on = scrollY > 120; n.classList.toggle('show', on); if (!on) n.classList.remove('open') }
        addEventListener('scroll', navUp, { passive: true });
        document.addEventListener('click', e => { const n = $('.nav'); if (!n) return; if (e.target.closest('[data-mn]')) n.classList.toggle('open'); else if (e.target.closest('.nav a')) n.classList.remove('open') });
        /* ---- admin ---- */
        const F = (p, l, t = 'text') => `<label>${l}${t == 'area' ? `<textarea rows="6" data-p="${p}">${esc(get(p))}</textarea>` : `<input type="${t}" data-p="${p}" value="${esc(get(p))}">`}</label>`;
        const IMG = p => `<div class="ip">${get(p) ? `<img src="${esc(get(p))}">` : ''}<input type="file" accept="image/*" data-img="${p}"></div>`;
        const row = (k, i, x) => `<div class="r">${x}<button data-del="${k}.${i}">Remover</button></div>`;
        const ADD = { menu: () => ({ cat: D.cats[0], name: 'Novo prato', desc: '', price: 'R$ 0,00', img: '', hl: false }), gallery: () => ({ img: '', desc: '' }), reviews: () => ({ name: '', text: '' }), events: () => ({ title: '', desc: '' }) };
        const add = k => `<button data-add="${k}">+ Adicionar</button>`;
        const B = {
            g: () => '<label>Logo (PNG com fundo transparente)</label>' + IMG('cfg.logo') + ['name:Nome', 'tagline:Frase de destaque', 'phone:WhatsApp (só números com DDI, ex 5511999999999)', 'city:Cidade (ajuda no Google)', 'address:Endereço', 'mapq:Endereço para o mapa (usado se não houver pin)', 'mapurl:Link do pin no Google Maps (Compartilhar → Copiar link)', 'mapembed:Mapa incorporado (Compartilhar → Incorporar um mapa → copiar o HTML)', 'insta:Instagram (usuário)', 'facebook:Facebook (link completo, opcional)', 'email:E-mail de contato (opcional)', 'ifood:Link do delivery (opcional)', 'promo:Promoção do site', 'cv_title:Título da seção Caminho do Vinho'].map(s => { const [k, l] = s.split(':'); return F('cfg.' + k, l) }).join('') + F('cfg.story', 'Nossa história', 'area') + F('cfg.cv_text', 'Texto da seção Caminho do Vinho', 'area') + '<h4>Horários (vazio = fechado)</h4>' + D.cfg.hours.map((h, i) => `<div class="r h">${DN[i]} <input type="time" data-p="cfg.hours.${i}.o" value="${h.o}"> às <input type="time" data-p="cfg.hours.${i}.c" value="${h.c}"></div>`).join(''),
            m: () => `<label>Categorias (separadas por vírgula)<input data-cats value="${esc(D.cats.join(', '))}"></label>` + D.menu.map((m, i) => row('menu', i, IMG(`menu.${i}.img`) + `<label>Categoria<select data-p="menu.${i}.cat">${D.cats.map(k => `<option ${k == m.cat ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></label>` + F(`menu.${i}.name`, 'Nome') + F(`menu.${i}.price`, 'Preço') + F(`menu.${i}.desc`, 'Descrição') + `<label class="ck"><input type="checkbox" data-p="menu.${i}.hl" ${m.hl ? 'checked' : ''}> Prato destaque</label>`)).join('') + add('menu'),
            f: () => D.gallery.map((g, i) => row('gallery', i, IMG(`gallery.${i}.img`) + F(`gallery.${i}.desc`, 'Descrição da foto'))).join('') + add('gallery'),
            r: () => D.reviews.map((g, i) => row('reviews', i, F(`reviews.${i}.name`, 'Nome') + F(`reviews.${i}.text`, 'Depoimento', 'area'))).join('') + add('reviews'),
            e: () => D.events.map((g, i) => row('events', i, F(`events.${i}.title`, 'Título') + F(`events.${i}.desc`, 'Descrição'))).join('') + add('events')
        };
        const T = { g: 'Geral', m: 'Cardápio', f: 'Fotos', r: 'Depoimentos', e: 'Eventos' };
        function adm() { $('#admin').innerHTML = `<div class="ah"><b>Painel</b><span id="st">Edite e clique em salvar.</span><button data-pub>Salvar alterações</button><button data-close>Fechar</button></div><div class="tabs">${Object.keys(T).map(k => `<button class="${k == at ? 'on' : ''}" data-at="${k}">${T[k]}</button>`).join('')}</div><div class="ab">${B[at]()}</div>` }
        const shrink = (f, png) => new Promise(r => { const i = new Image; i.onload = () => { const s = Math.min(1, (png ? 700 : 900) / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = i.width * s; c.height = i.height * s; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); r(png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .78)) }; i.src = URL.createObjectURL(f) });
        async function api(u, b) { const r = await fetch(u, { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-password': sessionStorage.getItem('pw') || '' }, body: JSON.stringify(b) }); if (!r.ok) throw new Error(r.status); return r.json() }
        async function enviar(du) { const [m, b] = du.split(','), tipo = m.match(/data:(.*?);/)[1]; return (await api('/api/upload', { nome: 'foto.' + (tipo == 'image/png' ? 'png' : 'jpg'), tipo, dados: b })).url }
        async function salvar() { const st = $('#st'); try { st.textContent = 'Salvando…'; await api('/api/save', D); st.textContent = 'Salvo! O site já está atualizado.' } catch (x) { st.textContent = x.message == '401' ? 'Senha incorreta. Recarregue a página e entre de novo.' : 'Não foi possível salvar. Tente novamente.' } }
        document.addEventListener('input', e => { const t = e.target; if (t.dataset.p) set(t.dataset.p, t.type == 'checkbox' ? t.checked : t.value); if ('cats' in t.dataset) D.cats = t.value.split(',').map(s => s.trim()).filter(Boolean) });
        document.addEventListener('change', async e => { const t = e.target; if (t.dataset.img && t.files[0]) { const st = $('#st'); try { if (st) st.textContent = 'Enviando foto…'; set(t.dataset.img, await enviar(await shrink(t.files[0], t.dataset.img == 'cfg.logo'))); adm() } catch (x) { if (st) st.textContent = 'Falha ao enviar a foto.' } } });
        document.addEventListener('click', e => {
            const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
            if (d.t) { tab = d.t; $('#mb').innerHTML = menuH() }
            else if (d.at) { at = d.at; adm() }
            else if (d.add) { D[d.add].push(ADD[d.add]()); adm() }
            else if (d.del) { const [k, i] = d.del.split('.'); D[k].splice(i, 1); adm() }
            else if ('pub' in d) salvar();
            else if ('close' in d) { if (location.hash) location.hash = ''; else if (isAdm()) location.href = location.pathname.replace(/administracao\/?$/, ''); $('#admin').classList.remove('on'); tab = D.cats[0]; site() }
            else if ('open' in d) { $('#admin').classList.add('on'); adm() }
        });
        site();
        const isAdm = () => /administracao\/?$/.test(location.pathname) || location.hash == '#/administracao';
        if (isAdm()) { const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; document.head.appendChild(m) }
        function login() { const a = $('#admin'); a.classList.add('on'); a.innerHTML = '<form id="lg" style="margin-top:20vh"><h2>Administração</h2><input type="password" id="pw" placeholder="Senha" autocomplete="current-password" required><button>Entrar</button><span id="lm" style="text-align:center"></span></form>'; $('#lg').onsubmit = async e => { e.preventDefault(); sessionStorage.setItem('pw', $('#pw').value); try { await api('/api/check', {}); adm() } catch (x) { sessionStorage.removeItem('pw'); $('#lm').textContent = 'Senha incorreta.' } } }
        async function chk() { const a = $('#admin'); if (!isAdm()) { a.classList.remove('on'); return } a.classList.add('on'); if (sessionStorage.getItem('pw')) { try { await api('/api/check', {}); adm(); return } catch (x) { sessionStorage.removeItem('pw') } } login() }
        addEventListener('hashchange', chk);
        fetch('/api/site').then(r => r.ok ? r.json() : null).then(d => { if (d && d.cfg) { D.cfg = { ...D.cfg, ...d.cfg };['cats', 'menu', 'gallery', 'reviews', 'events'].forEach(k => { if (d[k]) D[k] = d[k] }); tab = D.cats[0]; site() } }).catch(() => { }).finally(chk);
    </script>
</body>

</html>
